name: Deploy One-Click Key to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build production PWA bundle
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          # Optional Google Search Console ownership verification token (Repository Variable).
          # Omitted if unset; injects only a static <meta> tag at build time with zero network calls.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          echo "Resolved GitHub Pages URL: ${{ steps.pages.outputs.base_url }}"
          echo "Building One-Click Key with VITE_BASE_PATH=${VITE_BASE_PATH}"
          npm run build

      - name: Verify production asset base path
        env:
          RAW_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        run: |
          EXPECTED_BASE="$RAW_BASE"
          if [ "$EXPECTED_BASE" != "/" ]; then
            EXPECTED_BASE="/${EXPECTED_BASE#/}"
            EXPECTED_BASE="${EXPECTED_BASE%/}/"
          fi
          echo "Verifying dist/index.html uses base path: ${EXPECTED_BASE}"
          grep -q "src=\"${EXPECTED_BASE}assets/" dist/index.html
          grep -q "href=\"${EXPECTED_BASE}assets/" dist/index.html
          grep -q "href=\"${EXPECTED_BASE}manifest.webmanifest\"" dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
