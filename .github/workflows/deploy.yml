name: Deploy One-Click Key to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Resolve GitHub Pages base path
        id: pages_base
        env:
          CUSTOM_BASE: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_BASE" ]; then
            echo "base=$CUSTOM_BASE" >> "$GITHUB_OUTPUT"
          elif [ -f public/CNAME ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${{ github.event.repository.name }}"
            OWNER_PAGES="${{ github.repository_owner }}.github.io"
            if [ "${REPO_NAME,,}" = "${OWNER_PAGES,,}" ]; then
              echo "base=/" >> "$GITHUB_OUTPUT"
            else
              echo "base=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build production PWA bundle
        env:
          VITE_BASE_PATH: ${{ steps.pages_base.outputs.base }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
